name: Feature request
description: Suggest an idea for the Nowly CLI.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem or use case?
      description: What are you trying to achieve that is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution
      description: What should the CLI do differently or what new command would help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you have tried?

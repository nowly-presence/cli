name: Bug report
description: Report a bug in the Nowly CLI.
title: "bug: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: CLI version
      placeholder: 1.2.2
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: 22.x
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm presence init`
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output

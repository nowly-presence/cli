version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: stable
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    target-branch: stable
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
